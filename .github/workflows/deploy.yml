name: 部署到 Cloudflare Workers

on:
  push:
    branches: [main]
    paths:
      - 'worker.js'
      - 'wrangler.toml'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      environment:
        description: '部署环境'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging

permissions:
  contents: read
  actions: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.repository.owner.id == github.event.sender.id
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 验证 worker.js 文件
        run: |
          set -euo pipefail
          echo "=== 文件信息 ==="
          ls -lh worker.js
          echo ""
          echo "=== 代码统计 ==="
          echo "总行数: $(wc -l < worker.js)"
          echo "文件大小: $(stat -c%s worker.js) 字节"
          echo ""
          echo "=== 版本信息 ==="
          grep "version:" worker.js | head -1 || echo "未找到版本号"
          echo ""
          echo "=== 关键功能检查 ==="
          if grep -q "handleGitHub" worker.js; then
            echo "✅ GitHub 加速功能存在"
          else
            echo "❌ GitHub 加速功能缺失"
            exit 1
          fi
          if grep -q "handleDockerRegistry" worker.js; then
            echo "✅ Docker 镜像代理功能存在"
          else
            echo "❌ Docker 镜像代理功能缺失"
            exit 1
          fi
          if grep -q "handleGoogleSheet" worker.js; then
            echo "✅ Google Sheets 代理功能存在"
          else
            echo "❌ Google Sheets 代理功能缺失"
            exit 1
          fi

      - name: 设置 Node.js 环境
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 安装 Wrangler CLI
        run: |
          npm install -g wrangler@latest
          wrangler --version

      - name: 部署到 Cloudflare Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          
          # 检查必需的环境变量
          if [ -z "${CLOUDFLARE_API_TOKEN}" ]; then
            echo "❌ 错误: 未配置 CLOUDFLARE_API_TOKEN"
            echo "请在 GitHub 仓库设置中添加 Secret: CLOUDFLARE_API_TOKEN"
            exit 1
          fi
          
          if [ -z "${CLOUDFLARE_ACCOUNT_ID}" ]; then
            echo "❌ 错误: 未配置 CLOUDFLARE_ACCOUNT_ID"
            echo "请在 GitHub 仓库设置中添加 Secret: CLOUDFLARE_ACCOUNT_ID"
            exit 1
          fi
          
          echo "=== 开始部署 ==="
          echo "账户 ID: ${CLOUDFLARE_ACCOUNT_ID:0:8}****"
          echo "Worker 名称: proxy"
          echo ""
          
          # 部署 Worker
          wrangler deploy worker.js \
            --name proxy \
            --compatibility-date 2024-01-01 \
            --compatibility-flags nodejs_compat
          
          echo ""
          echo "=== 部署完成 ==="

      - name: 验证部署
        env:
          WORKER_URL: ${{ secrets.WORKER_URL || 'https://proxy.xiaonuo.live' }}
        run: |
          set -euo pipefail
          
          echo "=== 等待边缘节点同步 ==="
          sleep 30
          
          echo ""
          echo "=== 验证部署 ==="
          echo "Worker URL: ${WORKER_URL}"
          echo ""
          
          # 1. 检查主页
          echo "📝 测试 1: 检查主页"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${WORKER_URL}/")
          if [ "${STATUS}" = "200" ]; then
            echo "✅ 主页正常 (HTTP ${STATUS})"
          else
            echo "❌ 主页异常 (HTTP ${STATUS})"
          fi
          echo ""
          
          # 2. 检查版本
          echo "📝 测试 2: 检查版本信息"
          VERSION=$(curl -s "${WORKER_URL}/debug" | jq -r '.version // "未知"')
          BUILD_DATE=$(curl -s "${WORKER_URL}/debug" | jq -r '.buildDate // "未知"')
          echo "版本: ${VERSION}"
          echo "构建日期: ${BUILD_DATE}"
          echo ""
          
          # 3. 检查 GitHub 加速
          echo "📝 测试 3: GitHub 加速功能"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${WORKER_URL}/https://httpbin.org/get")
          if [ "${STATUS}" = "200" ]; then
            echo "✅ GitHub 加速正常 (HTTP ${STATUS})"
          else
            echo "❌ GitHub 加速异常 (HTTP ${STATUS})"
            echo "警告: 功能可能未正常工作"
          fi
          echo ""
          
          # 4. 检查 Docker API
          echo "📝 测试 4: Docker Registry API"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${WORKER_URL}/v2/")
          if [ "${STATUS}" = "200" ] || [ "${STATUS}" = "401" ]; then
            echo "✅ Docker API 正常 (HTTP ${STATUS})"
          else
            echo "⚠️  Docker API 返回 HTTP ${STATUS}"
          fi
          echo ""
          
          # 5. 检查路由顺序
          echo "📝 测试 5: 路由配置"
          ROUTE_CHECK=$(curl -s "${WORKER_URL}/test-route" | jq -r '.routeOrder[4] // "未找到"')
          if [[ "${ROUTE_CHECK}" == *"GitHub URL check"* ]]; then
            echo "✅ 路由顺序正确"
          else
            echo "⚠️  路由顺序可能有问题: ${ROUTE_CHECK}"
          fi
          echo ""
          
          echo "=== 验证完成 ==="

      - name: 部署总结
        if: always()
        run: |
          echo "=== 部署总结 ==="
          echo "仓库: ${{ github.repository }}"
          echo "分支: ${{ github.ref_name }}"
          echo "提交: ${{ github.sha }}"
          echo "触发方式: ${{ github.event_name }}"
          echo "Worker URL: ${{ secrets.WORKER_URL || 'https://proxy.xiaonuo.live' }}"
          echo ""
          echo "访问以下 URL 测试功能："
          echo "- 主页: ${{ secrets.WORKER_URL || 'https://proxy.xiaonuo.live' }}"
          echo "- 调试: ${{ secrets.WORKER_URL || 'https://proxy.xiaonuo.live' }}/debug"
          echo "- GitHub: https://github.com/${{ github.repository }}"

      - name: 清理旧的 workflow 运行记录
        uses: Mattraks/delete-workflow-runs@v2
        with:
          retain_days: 7
          keep_minimum_runs: 3
