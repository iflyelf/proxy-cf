#=================================================
# Cloudflare Workers 配置文件
# https://github.com/iflyelf/proxy-cf
#=================================================

name = "proxy"
main = "worker.js"
compatibility_date = "2024-01-01"
compatibility_flags = ["nodejs_compat"]

# Workers 基本配置
workers_dev = true
route = ""
zone_id = ""

# 账户配置（通过环境变量或 GitHub Secrets 提供）
# account_id = "your-account-id"

# 环境变量（可选）
[env.production]
name = "proxy"

[env.staging]
name = "proxy-staging"

# 限制配置
[limits]
cpu_ms = 50

# 触发器配置
[triggers]
crons = []

# 构建配置
[build]
command = ""
cwd = ""
watch_dirs = []

# 兼容性设置
[compatibility_flags]
nodejs_compat = true
